# Render Blueprint: free web service running the keyless replay demo from the Dockerfile.
# ADMIN_TOKEN is left unset so judges can open /admin (the SPA reads a token from localStorage only).
services:
  - type: web
    name: claimpilot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: replay
      - key: SEED_DEMO
        value: "1"
      - key: DATABASE_URL
        value: sqlite:////tmp/app.db
      - key: REPLAY_DELAY_S
        value: "0.3"
      - key: DEMO_TODAY
        value: "2026-10-10"
