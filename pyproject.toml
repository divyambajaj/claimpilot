[project]
name = "claimpilot"
version = "0.1.0"
description = "ClaimPilot: an AI expense and reimbursement agent. The LLM perceives, the code decides."
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "anthropic>=0.40",
    "pillow>=10.4",
    "pypdfium2>=4.30",
    "numpy>=2.0",
    "rapidfuzz>=3.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["backend"]
extend-exclude = ["frontend", "docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "UP046", "PT018"]

[tool.ruff.lint.per-file-ignores]
"backend/scripts/*" = ["E402", "E501", "ASYNC240"]
"backend/tests/*" = ["ASYNC240", "RUF012", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=80"
filterwarnings = ["ignore::DeprecationWarning:pypdfium2.*"]

[tool.coverage.run]
source = ["backend/app"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
